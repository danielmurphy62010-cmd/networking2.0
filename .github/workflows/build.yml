name: Rust Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # The vendored OpenSSL build needs Perl and NASM on Windows.
      - name: Install Windows OpenSSL build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --no-progress -y
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux OpenSSL build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential perl pkg-config

      - name: Check Rust source
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Build optimized version
        run: cargo build --release
