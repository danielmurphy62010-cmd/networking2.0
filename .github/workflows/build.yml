name: Build Networking v2.0

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read build configuration
        id: config
        shell: bash
        run: |
          echo "python-version=$(jq -r '.python_version' build_config.json)" >> "$GITHUB_OUTPUT"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "artifact-name=$(jq -r '.artifacts.windows_name' build_config.json)" >> "$GITHUB_OUTPUT"
            echo "artifact-pattern=$(jq -r '.artifacts.windows_pattern' build_config.json)" >> "$GITHUB_OUTPUT"
          else
            echo "artifact-name=$(jq -r '.artifacts.linux_name' build_config.json)" >> "$GITHUB_OUTPUT"
            echo "artifact-pattern=$(jq -r '.artifacts.linux_pattern' build_config.json)" >> "$GITHUB_OUTPUT"
          fi
          echo "build-dependencies=$(jq -r '.build_dependencies | join(" ")' build_config.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.config.outputs.python-version }}

      - name: Install build dependencies
        run: python -m pip install ${{ steps.config.outputs.build-dependencies }}

      - name: Build native extension
        run: python setup.py build_ext --inplace --force

      - name: Upload compiled extension
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.artifact-name }}
          path: ${{ steps.config.outputs.artifact-pattern }}
          if-no-files-found: error
