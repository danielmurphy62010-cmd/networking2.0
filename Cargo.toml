[package]
name = "network2"
version = "0.1.0"
edition = "2024"

[lib]
name = "network2"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
aes-gcm = "0.11"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
argon2 = "0.6"
blake3 = "1.5"
rand = "0.10"
tokio = { version = "1.0", features = ["full"] }
ring = "0.17"