[package]
name = "network2"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Python-compatible Rust replacement for the Crypton network.py protocol"

[lib]
name = "network2"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
cx448 = "0.1.1"
ed25519-dalek = "2.2"
argon2 = "0.5"
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
blake3 = "1"
getrandom = "0.2"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
zxcvbn = "3"
socket2 = "0.6"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
