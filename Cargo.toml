[package]
name = "backend_encryption_test"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# backend.rs
async-channel = "2"
futures = "0.3"
rand = "0.8"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Encryption.rs
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
ctr = "0.9"
hkdf = "0.12"
openssl = { version = "0.10", features = ["vendored"] }
sha2 = "0.10"
subtle = "2"
